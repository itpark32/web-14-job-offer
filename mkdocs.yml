site_name: Поиск работы Frontend-разработчиком — IT-ПАРК
site_description: "Практическая методичка для выпускников Web-курса IT-ПАРК: от резюме и портфолио до собеседований и оффера."
exclude_docs: |
  !/templates/
site_url: https://itpark32.github.io/web-14-job-offer/
repo_name: itpark32/web-14-job-offer
repo_url: https://github.com/itpark32/web-14-job-offer
edit_uri: edit/main/docs/
copyright: IT-ПАРК · Редакция 26 октября 2026 · Источники и ограничения указаны в тексте.

theme:
  name: material
  language: ru
  font: false
  icon:
    repo: fontawesome/brands/github
    logo: material/briefcase-outline
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
  features:
    - navigation.instant
    - navigation.instant.progress
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - ru
        - en
  - git-revision-date-localized:
      enabled: !ENV [ENABLE_GIT_DATES, false]
      enable_creation_date: true
      fallback_to_build_date: true
      locale: ru
      type: date

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
    absolute_links: warn

nav:
  - Начало:
      - Как пользоваться handbook: index.md
      - Связь с Web-методичкой: about.md
  - Старт поиска:
      - Рынок Junior Frontend в 2026 году: getting-started/market-2026.md
      - Целевая роль: getting-started/target.md
      - Первая работа без опыта: getting-started/no-experience.md
      - Первая неделя поиска: getting-started/plan.md
  - Материалы кандидата:
      - Резюме Frontend-разработчика: resume/resume.md
      - Примеры формулировок: resume/examples.md
      - GitHub-профиль: resume/profile.md
      - Портфолио: resume/portfolio.md
      - Учебный проект → портфолио: resume/project-to-portfolio.md
      - Live demo: resume/live-demo.md
  - Поиск вакансий:
      - Где искать: job-search/channels.md
      - Как читать вакансию и выбирать отклики: job-search/read-vacancy.md
      - Отклики и job tracker: job-search/applications.md
      - Общение с рекрутером: job-search/recruiter.md
      - Follow-up: job-search/follow-up.md
      - Отказы и диагностика: job-search/rejections.md
  - Собеседования:
      - Как устроен найм: interviews/process.md
      - Подготовка к ближайшему этапу: technical/developer.md
      - Как рассказать о проекте: interviews/project.md
      - Live coding: interviews/live-coding.md
      - Code review: interviews/code-review.md
      - Debugging: interviews/debugging.md
      - Верстка на интервью: interviews/layout.md
      - Тестовое задание: interviews/test-assignment.md
      - Поведенческое интервью: interviews/behavioral.md
      - Вопросы компании: interviews/company.md
  - Зарплата и оффер:
      - Зарплатные ожидания: salary/expectations.md
      - Переговоры: salary/negotiation.md
      - Проверка оффера: salary/offer.md
  - Шаблоны: templates/index.md
  - Источники: resources/sources.md
